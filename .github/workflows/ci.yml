name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # also caches the tools
      - uses: Swatinem/rust-cache@v2 # caches ~/.cargo and target/
      - run: mise run lint
      - run: mise run test

  # The release's builds, alongside the checks. A broken app shows up before
  # a tag, and the tag's release job, which can only restore caches saved on
  # main, finds their dependencies already built.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run build
      - run: mise run app

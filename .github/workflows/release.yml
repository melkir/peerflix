name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon, so the build is arm64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: cargo build --release --locked
        env:
          PEERFLIX_VERSION: ${{ github.ref_name }}
      - name: Package
        run: |
          name="peerflix-$GITHUB_REF_NAME-aarch64-apple-darwin"
          mkdir "$name"
          cp target/release/peerflix README.md LICENSE "$name/"
          cp -r completions "$name/"
          tar czf "$name.tar.gz" "$name"
          # IINA installs the .iinaplgz of the latest release, a zip with the
          # plugin's files at its root.
          plugin="peerflix-$GITHUB_REF_NAME.iinaplgz"
          (cd iina-plugin && zip -qrX "../$plugin" . -x '.*')
          shasum -a 256 "$name.tar.gz" "$plugin" > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.iinaplgz checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon, so the build is arm64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The dependencies CI's release job built on main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo build --release --locked
        env:
          PEERFLIX_VERSION: ${{ github.ref_name }}
      - run: crates/peerflix-app/bundle.sh
        env:
          PEERFLIX_VERSION: ${{ github.ref_name }}
      - name: Package
        run: |
          name="peerflix-$GITHUB_REF_NAME-aarch64-apple-darwin"
          mkdir "$name"
          cp target/release/peerflix README.md LICENSE "$name/"
          cp -r completions "$name/"
          tar czf "$name.tar.gz" "$name"
          # IINA installs the .iinaplgz of the latest release, a zip with the
          # plugin's files at its root.
          plugin="peerflix-$GITHUB_REF_NAME.iinaplgz"
          (cd iina-plugin && zip -qrX "../$plugin" . -x '.*')
          # No platform in the name, so mise installs the tarball, not the app.
          app="peerflix-app-$GITHUB_REF_NAME.zip"
          ditto -c -k --keepParent target/app/Peerflix.app "$app"
          shasum -a 256 "$name.tar.gz" "$plugin" "$app" > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.iinaplgz *.zip checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

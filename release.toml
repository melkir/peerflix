# `cargo release patch|minor|major --execute` bumps the version, commits,
# tags vX.Y.Z and pushes; the tag triggers .github/workflows/release.yml,
# which builds the binary, the app and the IINA plugin and creates the GitHub
# release. The crates share the workspace's version and are released as one.
allow-branch = ["main"]
publish = false
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
pre-release-commit-message = "Release v{{version}}"

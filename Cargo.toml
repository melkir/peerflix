[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/peerflix", "crates/peerflix-core"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/melkir/peerflix"
license = "MIT"

# Clippy's defaults, plus the pedantic lints that catch real waste or panics
# here; the pedantic group whole is mostly noise for this code.
[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
format_push_string = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
iter_on_single_items = "warn"
manual_let_else = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
string_lit_as_bytes = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
# Panics belong in tests; elsewhere, expect() says why one can't happen.
unwrap_used = "warn"

[workspace.dependencies]
peerflix-core = { path = "crates/peerflix-core" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# For setrlimit, to raise the open file limit.
libc = "0.2"
# rust-tls instead of the default native-tls, so Linux builds don't need OpenSSL.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
quick-xml = { version = "0.41", features = ["serialize"] }
# The same major version and TLS backend as librqbit, so it's linked once.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7.11", features = ["io", "rt"] }

[profile.release]
# Optimize for size: the work is network and disk bound, and hashing runs in
# aws-lc's assembly either way.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The app's: GPUI renders every frame, so it's optimized for speed, and thin
# LTO keeps its much larger build reasonable.
[profile.app]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16

[patch.crates-io]
# The fixes below are merged upstream but not in a release yet, so pin
# ikatson/rqbit main. Drop this once librqbit > 9.0.1 is on crates.io:
# - ikatson/rqbit#687: configurable per-peer request window, for faster seeks
# - ikatson/rqbit#688: 40 character .torrent URLs aren't taken for info hashes
# - ikatson/rqbit#689: stream() waits for the initial data check
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "8ebbd6c8c3f009e7dd6dc4c33bcceb0a90fe9cba" }

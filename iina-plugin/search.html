<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Torrents</title>
  <style>
    :root {
      color-scheme: light dark;
      --muted: color-mix(in srgb, CanvasText 55%, transparent);
      --line: color-mix(in srgb, CanvasText 12%, transparent);
      --hover: color-mix(in srgb, CanvasText 7%, transparent);
      --bar: color-mix(in srgb, CanvasText 4%, Canvas);
      --good: #2f9e44;
      --even: #c28a00;
      --bad: #e8590c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header { padding: 12px; border-bottom: 1px solid var(--line); }
    input[type="search"] { width: 100%; padding: 6px 8px; font: inherit; }
    .tabs { display: flex; gap: 4px; margin-top: 8px; }
    .tabs button {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: none;
      color: inherit;
      font: inherit;
    }
    .tabs button[aria-pressed="true"] { background: AccentColor; color: AccentColorText; border-color: AccentColor; }
    #crumb {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    #crumb[hidden] { display: none; }
    #crumb-title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; overflow-y: auto; }
    #list { transition: opacity 0.15s; }
    main.searching #list { opacity: 0.5; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: default; }
    li:hover { background: var(--hover); }
    .title { overflow-wrap: anywhere; }
    .meta, .state, .note { margin-top: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .state:empty { display: none; }
    li.failed .state { color: var(--bad); }
    li.pending .state::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { li.pending .state::before { animation: none; } }
    li.note:hover { background: none; }
    #empty { padding: 24px 12px; margin: 0; text-align: center; color: var(--muted); }
    #empty:empty { display: none; }
    #empty.error { color: var(--bad); }
    .good { color: var(--good); }
    .even { color: var(--even); }
    .bad { color: var(--bad); }
    footer { border-top: 1px solid var(--line); background: var(--bar); font-size: 11px; }
    footer:empty { display: none; }
    footer div { display: flex; gap: 12px; padding: 5px 12px; font-variant-numeric: tabular-nums; }
    footer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer .text { color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <input type="search" id="query" placeholder="Title, IMDb ID (tt1254207), or a magnet link" autofocus />
    <div class="tabs" role="group" aria-label="Category">
      <button data-category="anime">Anime</button>
      <button data-category="movies">Movies</button>
      <button data-category="series">Series</button>
    </div>
  </header>
  <nav id="crumb" hidden>
    <button id="back">‹ Results</button>
    <span id="crumb-title"></span>
  </nav>
  <main id="main">
    <ul id="list"></ul>
    <p id="empty" role="status"></p>
  </main>
  <footer id="streams" role="status" aria-label="Streams"></footer>

  <script>
    const $ = (id) => document.getElementById(id);

    // What the window shows. render() draws the page from it, and actions
    // change it, then render.
    const state = {
      category: "anime",
      // Whether a search is waiting for its results.
      searching: false,
      // The latest results, with the category and query they're for and a
      // note on the sites that failed. They're kept while episodes are shown.
      results: null,
      // Why the latest search failed, if it did.
      error: "",
      // The torrent whose episodes are shown, with its source and title, or
      // null while the results are.
      torrent: null,
      // The row being started, by its source and index, with the id of the
      // pick the plugin's answers carry, and how it goes: text, and kind,
      // "pending" or "failed".
      picking: null,
      // The streams being played, each a name and how its download is going.
      streams: [],
    };
    let timer = null;
    let picks = 0;

    function isSource(query) {
      return /^(magnet:|https?:\/\/)/.test(query.trim());
    }

    // The rows the list shows, each a torrent's source, the index of the
    // episode to play (null on a result's row), a title and details.
    function rows() {
      if (state.torrent) {
        const { source, episodes } = state.torrent;
        return episodes.map((e) => ({ source, index: e.index, title: e.path, meta: [e.size] }));
      }
      return (state.results?.results ?? []).map((r) => ({
        source: r.url,
        index: null,
        title: r.title,
        // A pasted magnet link or URL has no details.
        meta: r.site ? [`${r.date} · ${r.size} · `, health(r), ` · ${r.site}`] : [],
      }));
    }

    function isPicked(row) {
      const p = state.picking;
      return p != null && p.source === row.source && p.index === row.index;
    }

    // Changes what the list shows, from its top. The episodes it stops
    // showing, and a pick whose row it stops showing, are given up.
    function setList(changes) {
      const hadEpisodes = state.torrent != null;
      Object.assign(state, changes);
      const lost = state.picking != null && !rows().some(isPicked);
      if (lost) state.picking = null;
      if (lost || (hadEpisodes && !state.torrent)) iina.postMessage("cancel", null);
      render();
      $("main").scrollTop = 0;
    }

    // Asks the plugin to start row, unless it's starting already: a result
    // lists its episodes when it has several, and an episode plays.
    function pick(row) {
      if (isPicked(row) && state.picking.kind === "pending") return;
      const episode = row.index != null;
      const id = ++picks;
      state.picking = {
        pick: id,
        source: row.source,
        index: row.index,
        text: episode ? "Starting…" : "Fetching files…",
        kind: "pending",
      };
      const title = state.torrent?.title ?? row.title;
      iina.postMessage(episode ? "play" : "choose", { pick: id, source: row.source, title, index: row.index });
      render();
    }

    // Applies changes to the row being started, if it's still pick's.
    function updatePick(pick, changes) {
      if (pick !== state.picking?.pick) return;
      state.picking = changes && { ...state.picking, ...changes };
      render();
    }

    function search() {
      clearTimeout(timer);
      const query = $("query").value;
      // A pasted magnet link or URL plays straight away.
      if (isSource(query)) {
        const source = query.trim();
        const results = { results: [{ title: source, url: source }], note: "" };
        setList({ results, error: "", torrent: null, searching: false });
        pick(rows()[0]);
        return;
      }
      state.searching = true;
      render();
      iina.postMessage("search", { category: state.category, query });
    }

    function render() {
      for (const b of document.querySelectorAll(".tabs button")) {
        b.setAttribute("aria-pressed", String(b.dataset.category === state.category));
      }
      $("crumb").hidden = !state.torrent;
      $("crumb-title").textContent = state.torrent?.title ?? "";
      $("main").classList.toggle("searching", state.searching);
      const items = rows().map(rowElement);
      const note = state.torrent ? "" : state.results?.note;
      if (items.length && note) items.push(noteElement(note));
      $("list").replaceChildren(...items);
      const [text, error] = items.length ? ["", false] : emptyText();
      $("empty").textContent = text;
      $("empty").classList.toggle("error", error);
      renderStreams();
    }

    // What the list says when it has no rows, and whether that's an error.
    function emptyText() {
      if (state.searching) return ["Searching…", false];
      if (state.error) return [state.error, true];
      if (!state.results) return ["", false];
      const { category, query, note } = state.results;
      const q = query.trim();
      const none = q ? `No ${category} results for “${q}”.` : `No ${category} to show.`;
      return [[none, note].filter(Boolean).join(" "), false];
    }

    function rowElement(row) {
      const li = document.createElement("li");
      const t = document.createElement("div");
      t.className = "title";
      t.textContent = row.title;
      const m = document.createElement("div");
      m.className = "meta";
      m.append(...row.meta);
      const s = document.createElement("div");
      s.className = "state";
      if (isPicked(row)) {
        li.classList.add(state.picking.kind);
        s.textContent = state.picking.text;
      }
      li.append(t, m, s);
      li.addEventListener("click", () => pick(row));
      return li;
    }

    function noteElement(note) {
      const li = document.createElement("li");
      li.className = "note";
      li.textContent = note;
      return li;
    }

    function health(r) {
      const span = document.createElement("span");
      span.className = r.seeders > r.leechers ? "good" : r.seeders === r.leechers ? "even" : "bad";
      span.textContent = `${r.seeders} seeders`;
      return span;
    }

    // Each stream being played, with how its download is going.
    function renderStreams() {
      $("streams").replaceChildren(
        ...state.streams.map(({ name, text }) => {
          const div = document.createElement("div");
          const n = document.createElement("span");
          n.className = "name";
          n.textContent = name;
          const t = document.createElement("span");
          t.className = "text";
          t.textContent = text;
          div.append(n, t);
          return div;
        })
      );
    }

    iina.onMessage("results", (data) => {
      // Only the current category and query's results.
      if (data.category !== state.category || data.query !== $("query").value) return;
      setList({ results: data, error: "", torrent: null, searching: false });
    });

    iina.onMessage("searchFailed", ({ category, query, text }) => {
      if (category !== state.category || query !== $("query").value) return;
      setList({ results: null, error: text, torrent: null, searching: false });
    });

    iina.onMessage("episodes", ({ pick, source, title, episodes }) => {
      if (pick !== state.picking?.pick) return;
      setList({ torrent: { source, title, episodes }, picking: null });
    });

    iina.onMessage("progress", ({ pick, text }) => updatePick(pick, { text }));
    iina.onMessage("started", ({ pick }) => updatePick(pick, null));
    iina.onMessage("failed", ({ pick, text }) => updatePick(pick, { text, kind: "failed" }));

    iina.onMessage("streams", (streams) => {
      state.streams = streams;
      renderStreams();
    });

    $("back").addEventListener("click", () => setList({ torrent: null }));

    $("query").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(search, 400);
    });
    $("query").addEventListener("keydown", (e) => {
      if (e.key === "Enter") search();
    });

    for (const b of document.querySelectorAll(".tabs button")) {
      b.addEventListener("click", () => {
        state.category = b.dataset.category;
        search();
      });
    }

    search();
  </script>
</body>
</html>

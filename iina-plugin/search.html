<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Torrents</title>
  <style>
    :root {
      color-scheme: light dark;
      --muted: color-mix(in srgb, CanvasText 55%, transparent);
      --line: color-mix(in srgb, CanvasText 12%, transparent);
      --hover: color-mix(in srgb, CanvasText 7%, transparent);
      --bar: color-mix(in srgb, CanvasText 4%, Canvas);
      --good: #2f9e44;
      --even: #c28a00;
      --bad: #e8590c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header { padding: 12px; border-bottom: 1px solid var(--line); }
    input[type="search"] { width: 100%; padding: 6px 8px; font: inherit; }
    .tabs { display: flex; gap: 4px; margin-top: 8px; }
    .tabs button {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: none;
      color: inherit;
      font: inherit;
    }
    .tabs button[aria-pressed="true"] { background: AccentColor; color: AccentColorText; border-color: AccentColor; }
    #crumb {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    #crumb[hidden] { display: none; }
    #crumb-title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; overflow-y: auto; }
    #list { transition: opacity 0.15s; }
    main.searching #list { opacity: 0.5; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: default; }
    li:hover { background: var(--hover); }
    .title { overflow-wrap: anywhere; }
    .meta, .state, .note { margin-top: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .state:empty { display: none; }
    li.failed .state { color: var(--bad); }
    li.pending .state::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { li.pending .state::before { animation: none; } }
    li.note:hover { background: none; }
    #empty { padding: 24px 12px; margin: 0; text-align: center; color: var(--muted); }
    #empty:empty { display: none; }
    #empty.error { color: var(--bad); }
    .good { color: var(--good); }
    .even { color: var(--even); }
    .bad { color: var(--bad); }
    footer { border-top: 1px solid var(--line); background: var(--bar); font-size: 11px; }
    footer:empty { display: none; }
    footer div { display: flex; gap: 12px; padding: 5px 12px; font-variant-numeric: tabular-nums; }
    footer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer .text { color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <input type="search" id="query" placeholder="Title, IMDb ID (tt1254207), or a magnet link" autofocus />
    <div class="tabs" role="group" aria-label="Category">
      <button data-category="anime">Anime</button>
      <button data-category="movies">Movies</button>
      <button data-category="series">Series</button>
    </div>
  </header>
  <nav id="crumb" hidden>
    <button id="back">‹ Results</button>
    <span id="crumb-title"></span>
  </nav>
  <main>
    <ul id="list"></ul>
    <p id="empty" role="status"></p>
  </main>
  <footer id="streams" role="status" aria-label="Streams"></footer>

  <script>
    const $ = (id) => document.getElementById(id);
    let category = "anime";
    let timer = null;
    let lastResults = null;
    // The row picked and starting, which shows how it goes; while it's set,
    // other picks wait.
    let picked = null;

    function isSource(query) {
      return /^(magnet:|https?:\/\/)/.test(query.trim());
    }

    // Sends a pick to the plugin, unless another one is starting.
    function pick(li, name, data) {
      if (picked) return;
      for (const other of document.querySelectorAll("li.failed")) setState(other, "");
      picked = li;
      setState(li, name === "choose" ? "Fetching files…" : "Starting…", "pending");
      iina.postMessage(name, data);
    }

    // Shows text under the row's details, as kind ("pending" or "failed").
    function setState(li, text, kind) {
      li.classList.remove("pending", "failed");
      if (kind) li.classList.add(kind);
      li.querySelector(".state").textContent = text;
    }

    function search() {
      clearTimeout(timer);
      const query = $("query").value;
      // A pasted magnet link or URL plays straight away.
      if (isSource(query)) {
        const li = row(query.trim(), [], () => pick(li, "choose", { source: query.trim(), title: query.trim() }));
        show([li], "");
        li.click();
        return;
      }
      document.querySelector("main").classList.add("searching");
      if (!$("list").children.length) setEmpty("Searching…");
      iina.postMessage("search", { category, query });
    }

    function setEmpty(text, error = false) {
      $("empty").textContent = text;
      $("empty").classList.toggle("error", error);
    }

    function setCategory(name) {
      category = name;
      for (const b of document.querySelectorAll(".tabs button")) {
        b.setAttribute("aria-pressed", String(b.dataset.category === name));
      }
    }

    function row(title, meta, onClick) {
      const li = document.createElement("li");
      const t = document.createElement("div");
      t.className = "title";
      t.textContent = title;
      const m = document.createElement("div");
      m.className = "meta";
      m.append(...meta);
      const s = document.createElement("div");
      s.className = "state";
      li.append(t, m, s);
      li.addEventListener("click", onClick);
      return li;
    }

    function health(r) {
      const span = document.createElement("span");
      span.className = r.seeders > r.leechers ? "good" : r.seeders === r.leechers ? "even" : "bad";
      span.textContent = `${r.seeders} seeders`;
      return span;
    }

    // Shows rows in the list, with note, if any, after them.
    function show(rows, note) {
      document.querySelector("main").classList.remove("searching");
      const items = [...rows];
      if (note) {
        const li = document.createElement("li");
        li.className = "note";
        li.textContent = note;
        items.push(li);
      }
      $("list").replaceChildren(...items);
      $("list").parentElement.scrollTop = 0;
      setEmpty("");
    }

    function showResults({ results, note }) {
      lastResults = { results, note };
      if (!$("crumb").hidden) {
        // Leaving the episodes, whose torrent peerflix waits with.
        $("crumb").hidden = true;
        iina.postMessage("back", null);
      }
      show(
        results.map((r) => {
          const li = row(r.title, [`${r.date} · ${r.size} · `, health(r), ` · ${r.site}`], () =>
            pick(li, "choose", { source: r.url, title: r.title })
          );
          return li;
        }),
        results.length ? note : ""
      );
      if (!results.length) {
        const q = $("query").value.trim();
        const none = q ? `No ${category} results for “${q}”.` : `No ${category} to show.`;
        setEmpty([none, note].filter(Boolean).join(" "));
      }
    }

    iina.onMessage("results", (data) => {
      // Only the current category and query's results.
      if (data.category !== category || data.query !== $("query").value) return;
      showResults(data);
    });

    iina.onMessage("searchFailed", ({ category: c, query, text }) => {
      if (c !== category || query !== $("query").value) return;
      show([], "");
      setEmpty(text, true);
    });

    iina.onMessage("episodes", ({ source, title, episodes }) => {
      picked = null;
      $("crumb-title").textContent = title;
      $("crumb").hidden = false;
      show(
        episodes.map((e) => {
          const li = row(e.path, [e.size], () => pick(li, "play", { source, title, index: e.index }));
          return li;
        }),
        ""
      );
    });

    iina.onMessage("progress", ({ text }) => {
      if (picked) setState(picked, text, "pending");
    });

    iina.onMessage("started", () => {
      if (picked) setState(picked, "");
      picked = null;
    });

    iina.onMessage("failed", ({ text }) => {
      if (picked) setState(picked, text, "failed");
      picked = null;
    });

    // Each stream being played, with how its download is going.
    iina.onMessage("streams", (streams) => {
      $("streams").replaceChildren(
        ...streams.map(({ name, text }) => {
          const div = document.createElement("div");
          const n = document.createElement("span");
          n.className = "name";
          n.textContent = name;
          const t = document.createElement("span");
          t.className = "text";
          t.textContent = text;
          div.append(n, t);
          return div;
        })
      );
    });

    $("back").addEventListener("click", () => lastResults && showResults(lastResults));

    $("query").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(search, 400);
    });
    $("query").addEventListener("keydown", (e) => {
      if (e.key === "Enter") search();
    });

    for (const b of document.querySelectorAll(".tabs button")) {
      b.addEventListener("click", () => {
        setCategory(b.dataset.category);
        search();
      });
    }

    setCategory(category);
    search();
  </script>
</body>
</html>

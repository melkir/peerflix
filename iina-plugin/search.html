<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Torrents</title>
  <style>
    :root {
      color-scheme: light dark;
      --muted: color-mix(in srgb, CanvasText 55%, transparent);
      --line: color-mix(in srgb, CanvasText 12%, transparent);
      --hover: color-mix(in srgb, CanvasText 7%, transparent);
      --bar: color-mix(in srgb, CanvasText 4%, Canvas);
      --good: #2f9e44;
      --even: #c28a00;
      --bad: #e8590c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header { padding: 12px; border-bottom: 1px solid var(--line); }
    input[type="search"] { width: 100%; padding: 6px 8px; font: inherit; }
    .tabs { display: flex; gap: 4px; margin-top: 8px; }
    .tabs button {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: none;
      color: inherit;
      font: inherit;
    }
    .tabs button[aria-pressed="true"] { background: AccentColor; color: AccentColorText; border-color: AccentColor; }
    #crumb {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    #crumb[hidden] { display: none; }
    #crumb-title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; overflow-y: auto; }
    #list { transition: opacity 0.15s; }
    main.searching #list { opacity: 0.5; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: default; }
    li:hover { background: var(--hover); }
    li.selected { background: color-mix(in srgb, AccentColor 18%, transparent); }
    .title { overflow-wrap: anywhere; }
    .meta, .state, .note { margin-top: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .state:empty { display: none; }
    li.failed .state { color: var(--bad); }
    li.pending .state::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { li.pending .state::before { animation: none; } }
    li.note:hover { background: none; }
    #empty { padding: 24px 12px; margin: 0; text-align: center; color: var(--muted); }
    #empty:empty { display: none; }
    #empty.error { color: var(--bad); }
    .good { color: var(--good); }
    .even { color: var(--even); }
    .bad { color: var(--bad); }
    footer { border-top: 1px solid var(--line); background: var(--bar); font-size: 11px; }
    footer:empty { display: none; }
    footer div { display: flex; align-items: center; gap: 12px; padding: 5px 12px; font-variant-numeric: tabular-nums; }
    footer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The status keeps peerflix's columns. */
    footer .text { color: var(--muted); white-space: pre; }
    footer button {
      padding: 0 4px;
      border: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 16px;
    }
    footer button:hover { color: CanvasText; }
  </style>
</head>
<body>
  <header>
    <input type="search" id="query" placeholder="Title, IMDb ID (tt1254207), or a magnet link" autofocus
      aria-describedby="keys" />
    <span id="keys" hidden>Up and Down select a result, Enter opens it, Tab switches category.</span>
    <div class="tabs" role="group" aria-label="Category">
      <button data-category="anime">Anime</button>
      <button data-category="movies">Movies</button>
      <button data-category="series">Series</button>
    </div>
  </header>
  <nav id="crumb" hidden>
    <button id="back">‹ Results</button>
    <span id="crumb-title"></span>
  </nav>
  <main id="main">
    <ul id="list"></ul>
    <p id="empty" role="status"></p>
  </main>
  <footer id="streams" role="status" aria-label="Streams"></footer>

  <script>
    const $ = (id) => document.getElementById(id);

    // Handles the plugin's messages, which come percent-encoded; see post()
    // in global.js.
    function onMessage(name, callback) {
      iina.onMessage(name, (data) => callback(JSON.parse(decodeURIComponent(data))));
    }

    // What the window shows. render() draws the page from it, and actions
    // change it, then render.
    const state = {
      category: "anime",
      // Whether a search is waiting for its results.
      searching: false,
      // The latest results, with the category and query they're for and
      // peerflix's summary of the search: the sites that failed, or where else
      // to look when nothing was found. They're kept while episodes are shown.
      results: null,
      // Why the latest search failed, if it did.
      error: "",
      // The torrent whose episodes are shown, with its source and title, or
      // null while the results are.
      torrent: null,
      // The row being started, by its source and index, with the id of the
      // pick the plugin's answers carry, and how it goes: text, and kind,
      // "pending" or "failed".
      picking: null,
      // The row the arrows move through and Enter opens, by its place in the
      // list.
      selected: 0,
      // The streams being played, each a player id, name, how its download is
      // going, and whether it's paused and can be.
      streams: [],
    };
    let timer = null;
    let picks = 0;

    const CATEGORIES = ["anime", "movies", "series"];
    // How long fetching a torrent's files goes before its row says it can
    // take a while, in milliseconds.
    const SLOW = 15000;

    function isSource(query) {
      return /^(magnet:|https?:\/\/)/.test(query.trim());
    }

    // The rows the list shows, each a torrent's source, the index of the
    // episode to play (null on a result's row), a title and details.
    function rows() {
      if (state.torrent) {
        const { source, episodes } = state.torrent;
        const names = episodeNames(episodes);
        return episodes.map((e, i) => ({ source, index: e.index, title: names[i], meta: [e.size] }));
      }
      return (state.results?.results ?? []).map((r) => ({
        source: r.url,
        index: null,
        title: r.title,
        // A pasted magnet link or URL has no details.
        meta: r.site ? [`${r.date} · ${r.size} · `, health(r), ` · ${r.site}`] : [],
      }));
    }

    // Each episode's file name, or its path when another has the same name.
    function episodeNames(episodes) {
      const name = (e) => e.path.split("/").pop();
      const counts = new Map();
      for (const e of episodes) counts.set(name(e), (counts.get(name(e)) ?? 0) + 1);
      return episodes.map((e) => (counts.get(name(e)) > 1 ? e.path : name(e)));
    }

    function isPicked(row) {
      const p = state.picking;
      return p != null && p.source === row.source && p.index === row.index;
    }

    // Changes what the list shows, from its top. The episodes it stops
    // showing, and a pick whose row it stops showing, are given up.
    function setList(changes) {
      const left = state.torrent?.source;
      const hadEpisodes = left != null;
      Object.assign(state, changes);
      const lost = state.picking != null && !rows().some(isPicked);
      if (lost) state.picking = null;
      // Back from the episodes, the torrent they're from stays selected.
      state.selected = Math.max(0, state.torrent ? 0 : rows().findIndex((r) => r.source === left));
      if (lost || (hadEpisodes && !state.torrent)) iina.postMessage("cancel", null);
      render();
      $("main").scrollTop = 0;
    }

    // Asks the plugin to start row, unless it's starting already: a result
    // lists its episodes when it has several, and an episode plays.
    function pick(row) {
      if (isPicked(row) && state.picking.kind === "pending") return;
      const episode = row.index != null;
      const id = ++picks;
      state.picking = {
        pick: id,
        source: row.source,
        index: row.index,
        text: episode ? "Starting…" : "Fetching files…",
        kind: "pending",
      };
      const title = state.torrent?.title ?? row.title;
      iina.postMessage(episode ? "playEpisode" : "open", { pick: id, source: row.source, title, index: row.index });
      if (!episode) {
        setTimeout(() => {
          if (state.picking?.pick !== id || state.picking.text !== "Fetching files…") return;
          updatePick(id, { text: "Fetching files… A torrent with few seeders can take minutes." });
        }, SLOW);
      }
      render();
    }

    // Moves the selection by delta rows, keeping it in view.
    function select(delta) {
      const count = rows().length;
      if (!count) return;
      state.selected = Math.min(Math.max(state.selected + delta, 0), count - 1);
      render();
      $("list").children[state.selected]?.scrollIntoView({ block: "nearest" });
    }

    function setCategory(category) {
      state.category = category;
      search();
    }

    // Applies changes to the row being started, if it's still pick's.
    function updatePick(pick, changes) {
      if (pick !== state.picking?.pick) return;
      state.picking = changes && { ...state.picking, ...changes };
      render();
    }

    function search() {
      clearTimeout(timer);
      timer = null;
      const query = $("query").value;
      // A pasted magnet link or URL plays straight away.
      if (isSource(query)) {
        const source = query.trim();
        const results = { results: [{ title: source, url: source }], summary: "" };
        setList({ results, error: "", torrent: null, searching: false });
        pick(rows()[0]);
        return;
      }
      state.searching = true;
      render();
      iina.postMessage("search", { category: state.category, query });
    }

    function render() {
      for (const b of document.querySelectorAll(".tabs button")) {
        b.setAttribute("aria-pressed", String(b.dataset.category === state.category));
      }
      $("crumb").hidden = !state.torrent;
      $("crumb-title").textContent = state.torrent?.title ?? "";
      $("main").classList.toggle("searching", state.searching);
      const items = rows().map((row, i) => rowElement(row, i === state.selected));
      const note = state.torrent ? "" : state.results?.summary;
      if (items.length && note) items.push(noteElement(note));
      $("list").replaceChildren(...items);
      const [text, error] = items.length ? ["", false] : emptyText();
      $("empty").textContent = text;
      $("empty").classList.toggle("error", error);
      renderStreams();
    }

    // What the list says when it has no rows, and whether that's an error.
    function emptyText() {
      if (state.searching) return ["Searching…", false];
      if (state.error) return [state.error, true];
      return [state.results?.summary ?? "", false];
    }

    function rowElement(row, selected) {
      const li = document.createElement("li");
      li.classList.toggle("selected", selected);
      const t = document.createElement("div");
      t.className = "title";
      t.textContent = row.title;
      const m = document.createElement("div");
      m.className = "meta";
      m.append(...row.meta);
      const s = document.createElement("div");
      s.className = "state";
      if (isPicked(row)) {
        li.classList.add(state.picking.kind);
        s.textContent = state.picking.text;
      }
      li.append(t, m, s);
      li.addEventListener("click", () => pick(row));
      return li;
    }

    function noteElement(note) {
      const li = document.createElement("li");
      li.className = "note";
      li.textContent = note;
      return li;
    }

    function health(r) {
      const span = document.createElement("span");
      span.className = r.seeders > r.leechers ? "good" : r.seeders === r.leechers ? "even" : "bad";
      span.textContent = `${r.seeders} seeders`;
      return span;
    }

    // Each stream being played, with how its download is going and buttons
    // to pause it and to stop it.
    function renderStreams() {
      $("streams").replaceChildren(
        ...state.streams.map(({ id, name, text, paused, pausable }) => {
          const div = document.createElement("div");
          const n = document.createElement("span");
          n.className = "name";
          n.textContent = name;
          const t = document.createElement("span");
          t.className = "text";
          t.textContent = text;
          div.append(n, t);
          if (pausable) {
            const label = paused ? "Resume download" : "Pause download";
            div.append(button(paused ? "▶" : "❙❙", label, () => iina.postMessage("pause", { id })));
          }
          div.append(button("✕", "Stop and close the player", () => iina.postMessage("stop", { id })));
          return div;
        })
      );
    }

    function button(text, label, onClick) {
      const b = document.createElement("button");
      b.textContent = text;
      b.title = label;
      b.setAttribute("aria-label", label);
      b.addEventListener("click", () => {
        onClick();
        // Typing, the arrows and Tab keep working.
        $("query").focus();
      });
      return b;
    }

    onMessage("results", (data) => {
      // Only the current category and query's results.
      if (data.category !== state.category || data.query !== $("query").value) return;
      setList({ results: data, error: "", torrent: null, searching: false });
    });

    onMessage("searchFailed", ({ category, query, text }) => {
      if (category !== state.category || query !== $("query").value) return;
      setList({ results: null, error: text, torrent: null, searching: false });
    });

    onMessage("episodes", ({ pick, source, title, episodes }) => {
      if (pick !== state.picking?.pick) return;
      setList({ torrent: { source, title, episodes }, picking: null });
    });

    onMessage("progress", ({ pick, text }) => updatePick(pick, { text }));
    onMessage("started", ({ pick }) => updatePick(pick, null));
    onMessage("failed", ({ pick, text }) => updatePick(pick, { text, kind: "failed" }));

    onMessage("streams", (streams) => {
      state.streams = streams;
      renderStreams();
    });

    $("back").addEventListener("click", () => setList({ torrent: null }));

    $("query").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(search, 400);
    });
    $("query").addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        select(e.key === "ArrowDown" ? 1 : -1);
      } else if (e.key === "Enter") {
        // What's typed is searched first, then Enter opens the selection.
        const row = rows()[state.selected];
        if (timer != null || state.searching || !row) search();
        else pick(row);
      } else if (e.key === "Tab") {
        // As in peerflix's search on the command line.
        e.preventDefault();
        const i = CATEGORIES.indexOf(state.category) + (e.shiftKey ? -1 : 1);
        setCategory(CATEGORIES[(i + CATEGORIES.length) % CATEGORIES.length]);
      } else if (e.key === "Escape" && state.torrent) {
        e.preventDefault();
        setList({ torrent: null });
      }
    });

    for (const b of document.querySelectorAll(".tabs button")) {
      b.addEventListener("click", () => setCategory(b.dataset.category));
    }

    search();
  </script>
</body>
</html>

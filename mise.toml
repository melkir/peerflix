[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
cargo-release = "1.1.6"

[tasks.build]
description = "Build target/release/peerflix"
run = "cargo build --release --locked"

[tasks.app]
description = "Build target/app/Peerflix.app"
run = "crates/peerflix-app/bundle.sh"

[tasks.lint]
description = "Check formatting and run clippy"
run = ["cargo fmt --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks.test]
description = "Run tests"
run = "cargo test --workspace --locked"

[tasks.ci]
description = "Everything CI checks"
depends = ["lint", "test", "build", "app"]

[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt" }
cargo-release = "1.1.6"

[tasks.build]
description = "Build target/release/peerflix"
run = "cargo build --release --locked"

[tasks.lint]
description = "Check formatting and run clippy"
run = ["cargo fmt --check", "cargo clippy --all-targets --locked -- -D warnings"]

[tasks.test]
description = "Run tests"
run = "cargo test --locked"

[tasks.ci]
description = "Everything CI checks"
depends = ["lint", "test", "build"]

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"

[tasks.build]
description = "Build ./peerflix"
run = "go build -o peerflix ."

[tasks.lint]
description = "Run linters and check go.mod is tidy"
run = ["golangci-lint run ./...", "go mod tidy -diff"]

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.ci]
description = "Everything CI checks"
depends = ["lint", "test", "build"]

[tasks.snapshot]
description = "Build release archives locally into dist/, without publishing"
run = "goreleaser release --snapshot --clean"
